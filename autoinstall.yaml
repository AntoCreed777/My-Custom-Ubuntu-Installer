#cloud-config
# ============================================================
# UBUNTU SERVER AUTOINSTALL — SETUP PERSONAL
# ============================================================

autoinstall:
  version: 1

  # ==========================================================
  # LOCALIZACIÓN
  # ==========================================================
  locale: es_CL.UTF-8
  timezone: America/Santiago

  keyboard:
    layout: latam

  # ==========================================================
  # IDENTIDAD
  # ==========================================================
  identity:
    hostname: personal-ubuntu
    username: antocreed777
    # Generar con: mkpasswd -m sha-512
    password: "$6$REEMPLAZAR_POR_HASH_REAL"

  # ==========================================================
  # ==========================================================

  updates: security

  drivers:
    install: true

  # ==========================================================
  # SSH
  # ==========================================================
  ssh:
    install-server: true
    allow-pw: true

  # ==========================================================
  # PAQUETES
  # ==========================================================
  packages:

    # ===============================
    # GUI
    # ===============================
    - ubuntu-desktop-minimal

    # ===============================
    # SISTEMA BASE
    # ===============================
    - ca-certificates
    - gnupg
    - curl
    - wget
    - unzip
    - git
    - unattended-upgrades

    # ===============================
    # DESARROLLO NATIVO
    # ===============================
    - build-essential
    - clang
    - gdb
    - valgrind

    # ===============================
    # PYTHON
    # ===============================
    - python3
    - python3-pip
    - python3-venv
    - python3-dev
    - pipx

    # ===============================
    # UTILIDADES PRODUCTIVIDAD
    # ===============================
    - vim
    - lsd
    - btop
    - htop
    - ncdu
    - ripgrep
    - bat

  # ==========================================================
  # SNAPS
  # ==========================================================
  snaps:
    - name: firefox
      channel: stable

    - name: code
      channel: stable
      classic: true
    
    - name: yazi
      channel: stable
      classic: true

  # ==========================================================
  # CONFIGURACIÓN FINAL
  # ==========================================================
  late-commands:
    # Establecer modo gráfico por defecto
    - curtin in-target -- systemctl set-default graphical.target

    # Asegurar NetworkManager
    - curtin in-target -- systemctl enable NetworkManager.service
    - curtin in-target -- systemctl disable systemd-networkd-wait-online.service

    # SSH Hardening básico
    - curtin in-target -- sed -i '$a AllowUsers antocreed777' /etc/ssh/sshd_config
    - curtin in-target -- sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config

    #  Configurar pipx e instalar PDM
    - curtin in-target -- sudo -i -u antocreed777 pipx ensurepath
    - curtin in-target -- sudo -i -u antocreed777 pipx install pdm

    # Instalar FastFetch
    - curtin in-target -- apt-get update
    - curtin in-target -- apt-get install -y software-properties-common  # Para poder usar el comando add-apt-repository durante la instalacion
    - curtin in-target -- add-apt-repository -y ppa:zhangsongcui3371/fastfetch
    - curtin in-target -- apt-get update
    - curtin in-target -- apt-get install -y fastfetch

    # Crear carpeta para GitHub
    - curtin in-target -- mkdir -p /home/antocreed777/Documentos/GitHub
    - curtin in-target -- chown -R antocreed777:antocreed777 /home/antocreed777/Documentos/GitHub

    # Alias
    - |
      curtin in-target -- bash -c "cat << 'EOF' >> /home/antocreed777/.bash_aliases
      # Salir de la terminal
      alias q='exit'

      # Visualizacion de archivos
      alias bat='batcat'

      # Limpiar pantalla
      alias cls='clear'
      alias c='clear'

      # Navegacion
      alias ..='cd ..'
      alias ...='cd ../..'

      alias irgit='cd /home/antocreed777/Documentos/GitHub'

      # ls
      alias ls='lsd --group-dirs first -1'
      alias ll='ls -AlF --date locale'
      alias tree='lsd --tree --group-dirs first --depth=2 2>/dev/null'

      # Actualizacion
      alias actualizar='sudo apt update && sudo apt upgrade -y'

      # Python
      alias activate='source ./.venv/bin/activate'

      # Git
      alias gs='git status'
      alias gaa='git add .'
      alias gcm='git commit -m'
      alias gps='git push'
      alias gpl='git pull'

      EOF"

    # Corregir permisos del archivo de alias
    - curtin in-target -- bash -c "chown antocreed777:antocreed777 /home/antocreed777/.bash_aliases"

    # Definir atajo para abrir terminal con Super+Enter
    - |
      curtin in-target -- bash -c "
      sudo -u antocreed777 dbus-run-session gsettings set org.gnome.settings-daemon.plugins.media-keys terminal \"['<Super>Return']\"
      "

    # Install Font
    - |
      curtin in-target -- bash -c "
      mkdir -p /home/antocreed777/.local/share/fonts/
      wget -O /tmp/FiraCode.zip https://github.com/ryanoasis/nerd-fonts/releases/download/v3.0.2/FiraCode.zip
      unzip -o /tmp/FiraCode.zip -d /home/antocreed777/.local/share/fonts/
      chown -R antocreed777:antocreed777 /home/antocreed777/.local/share/fonts/
      sudo -u antocreed777 fc-cache -fv
      rm /tmp/FiraCode.zip
      "

    # Instalar Starship
    - curtin in-target -- bash -c "curl -fsSL https://starship.rs/install.sh | sh -s -- -y"
    - curtin in-target -- sudo -u antocreed777 bash -c "echo 'eval \"\$(starship init bash)\"' >> ~/.bashrc"
    
    ### Crear carpeta config y archivo de configuracion de la terminal
    # Se obtiene usando el siguiente comando en una terminal ya configurada:
    # dconf dump /org/gnome/terminal/ > terminal.conf
    - |
      curtin in-target -- bash -c "
      mkdir -p /home/antocreed777/.config
      chown antocreed777:antocreed777 /home/antocreed777/.config

      cat > /home/antocreed777/.config/terminal.conf << 'EOF'
      [legacy/profiles:/:b1dcc9dd-5262-4d8d-a863-c897e6d979b9]
      background-color='rgb(0,0,0)'
      bold-is-bright=true
      font='FiraCode Nerd Font Mono 12'
      foreground-color='rgb(0,255,0)'
      use-system-font=false
      use-theme-colors=false
      EOF

      chown antocreed777:antocreed777 /home/antocreed777/.config/terminal.conf
      "

    # Aplicar configuración de terminal
    - |
      curtin in-target -- bash -c "
      sudo -u antocreed777 dbus-run-session dconf load /org/gnome/terminal/ < /home/antocreed777/.config/terminal.conf
      "

    # Establecer el perfil recién creado como predeterminado (El UUID del perfil se obtiene del archivo de configuración exportado previamente)
    - curtin in-target -- sudo -u antocreed777 dbus-run-session gsettings set org.gnome.Terminal.ProfilesList default "'b1dcc9dd-5262-4d8d-a863-c897e6d979b9'"

    # Limpieza final
    - curtin in-target -- apt-get autoremove -y
    - curtin in-target -- apt-get clean
